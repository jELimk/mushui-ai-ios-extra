name: Build Mushui 1.7.2 native IPA
on:
  push:
    branches: [release/1.7.2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        edition: [full, ai]
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen
      - name: Configure edition
        env:
          EDITION: ${{ matrix.edition }}
        run: |
          if [ "$EDITION" = ai ]; then
            sed -i '' 's/app.mushui.personal/app.mushui.ai.personal/g; s/CFBundleDisplayName: 沐水/CFBundleDisplayName: 沐水 AI/' native170/project.yml
            sed -i '' 's/MushuiAIOnly=false/MushuiAIOnly=true/' native170/www/client-config.js
          fi
          xcodegen generate --spec native170/project.yml --project native170
      - name: Build real ARM64 app
        run: |
          xcodebuild -project native170/Mushui170.xcodeproj -scheme Mushui170 -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO build > device.log 2>&1 || { tail -130 device.log; exit 1; }
          mkdir -p output/Payload
          cp -R build/device/Build/Products/Release-iphoneos/Mushui170.app output/Payload/
          cd output
          zip -qry Mushui-1.7.2-${{ matrix.edition }}-unsigned.ipa Payload
      - name: Build and run simulator
        env:
          EDITION: ${{ matrix.edition }}
        run: |
          xcodebuild -project native170/Mushui170.xcodeproj -scheme Mushui170 -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_LOCAL_EXECUTION_IDENTITY='Ad Hoc' build > simulator.log 2>&1 || { tail -130 simulator.log; exit 1; }
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k in sorted(d["devices"],key=lambda k:tuple(int(v) for v in k.split("iOS-")[-1].split("-") if v.isdigit()),reverse=True) for x in d["devices"][k] if "iPhone" in x["name"]))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/sim/Build/Products/Release-iphonesimulator/Mushui170.app
          BUNDLE=app.mushui.personal
          if [ "$EDITION" = ai ]; then BUNDLE=app.mushui.ai.personal; fi
          xcrun simctl launch "$DEVICE" "$BUNDLE" --recovery-qa
          DATA_DIR=$(xcrun simctl get_app_container "$DEVICE" "$BUNDLE" data)
          for attempt in $(seq 1 30); do
            if python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d.get("recoveryComplete") and d.get("nativeReady")' "$DATA_DIR/Documents/qa-status.json" 2>/dev/null; then break; fi
            sleep 3
          done
          cp "$DATA_DIR/Documents/qa-status.json" output/first-launch-qa.json
          python3 -c 'import json; d=json.load(open("output/first-launch-qa.json")); assert all(d.get(k) for k in ["ready","nativeReady","recoveryComplete","preserved","assetsComplete"]), d'
          xcrun simctl terminate "$DEVICE" "$BUNDLE"
          mv "$DATA_DIR/Documents/qa-status.json" "$DATA_DIR/Documents/qa-status-first-launch.json"
          xcrun simctl launch "$DEVICE" "$BUNDLE"
          for attempt in $(seq 1 15); do
            if python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d.get("nativeReady") and d.get("preserved") and d.get("assetsComplete")' "$DATA_DIR/Documents/qa-status.json" 2>/dev/null; then break; fi
            sleep 2
          done
          xcrun simctl io "$DEVICE" screenshot output/iPhone.png
          DATA_DIR=$(xcrun simctl get_app_container "$DEVICE" "$BUNDLE" data)
          xcrun simctl spawn "$DEVICE" log show --last 5m --style compact --predicate 'process == "Mushui170"' > output/runtime.log 2>&1 || true
          find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -name 'Mushui170*' -exec cp '{}' output/ ';' || true
          cp "$DATA_DIR/Documents/startup-trace.json" output/startup-trace.json 2>/dev/null || true
          cp "$DATA_DIR/Documents/qa-status.json" output/qa-status.json
          cat output/qa-status.json
          python3 -c 'import json; d=json.load(open("output/qa-status.json")); assert all(d[k] for k in ["ready","secure","crypto","version","nativeReady","recoveryComplete","preserved","assetsComplete"]), d'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Mushui-1.7.2-${{ matrix.edition }}-native
          path: |
            output/*.ipa
            output/*.png
            output/*.json
            output/*.log
            output/*.ips
            device.log
            simulator.log
          retention-days: 7
