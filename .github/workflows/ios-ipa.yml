name: Build Mizuki 3.0.7 native iOS

on:

  workflow_dispatch:

permissions:

  contents: read

jobs:

  native:

    runs-on: macos-15

    timeout-minutes: 35

    steps:

      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1

        with:

          xcode-version: latest-stable

      - run: brew install xcodegen

      - name: Generate native project

        run: xcodegen generate --spec native170/project.yml --project native170

      - name: Compile ARM64 native app

        run: |

          xcodebuild -project native170/Mushui170.xcodeproj -scheme Mushui170 -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO build > device.log 2>&1 || { tail -150 device.log; exit 1; }

          mkdir -p output/Payload

          cp -R build/device/Build/Products/Release-iphoneos/Mushui170.app output/Payload/

          cd output

          zip -qry Mizuki-3.0.7-iOS-full-unsigned.ipa Payload

      - name: Compile and check simulator startup

        run: |

          xcodebuild -project native170/Mushui170.xcodeproj -scheme Mushui170 -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- build > simulator.log 2>&1 || { tail -150 simulator.log; exit 1; }

          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k in sorted(d["devices"],reverse=True) for x in d["devices"][k] if "iPhone" in x["name"]))')

          xcrun simctl boot "$DEVICE" || true

          xcrun simctl bootstatus "$DEVICE" -b

          xcrun simctl install "$DEVICE" build/sim/Build/Products/Release-iphonesimulator/Mushui170.app

          xcrun simctl launch "$DEVICE" app.mushui.personal --recovery-qa

          DATA_DIR=$(xcrun simctl get_app_container "$DEVICE" app.mushui.personal data)

          for attempt in $(seq 1 35); do

            if python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d.get("recoveryComplete") and d.get("ready")' "$DATA_DIR/Documents/qa-status.json" 2>/dev/null; then break; fi

            sleep 3

          done

          cp "$DATA_DIR/Documents/qa-status.json" output/startup-qa.json

          python3 -c 'import json; d=json.load(open("output/startup-qa.json")); assert all(d.get(k) for k in ["ready","nativeReady","recoveryComplete","preserved","assetsComplete","version"]), d'

      - uses: actions/upload-artifact@v4

        if: always()

        with:

          name: Mizuki-3.0.7-iOS-native

          path: |

            output/*.ipa

            output/*qa.json

            device.log

            simulator.log

