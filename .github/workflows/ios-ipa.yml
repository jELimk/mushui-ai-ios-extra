name: Build standalone AI iPhone IPA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  iphone:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'
      - run: npm ci
      - run: npx cap sync ios
      - name: Compile real iPhone ARM64 application
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO IPHONEOS_DEPLOYMENT_TARGET=16.4 build > build.log 2>&1 || { tail -150 build.log; exit 1; }
          tail -12 build.log
      - name: Package IPA for Windows signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/App.app output/Payload/
          file output/Payload/App.app/App
          test -f output/Payload/App.app/public/index.html
          test -f output/Payload/App.app/public/ios-engine.js
          test ! -f output/Payload/App.app/public/human.js
          cd output
          zip -qry Mushui-AI-Extra-unsigned.ipa Payload
          shasum -a 256 Mushui-AI-Extra-unsigned.ipa > SHA256SUMS.txt
          cp ../INSTALL_WINDOWS_IOS.md .
      - name: Launch local-only app in iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/SimData CODE_SIGNING_ALLOWED=NO IPHONEOS_DEPLOYMENT_TARGET=16.4 build > simulator.log 2>&1 || { tail -100 simulator.log; exit 1; }
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for devices in data["devices"].values() for d in devices if "iPhone" in d["name"]))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/SimData/Build/Products/Release-iphonesimulator/App.app
          xcrun simctl launch "$DEVICE" app.mushui.ai.extra
          sleep 16
          xcrun simctl io "$DEVICE" screenshot output/iPhone-Simulator.png
          DATA_DIR=$(xcrun simctl get_app_container "$DEVICE" app.mushui.ai.extra data)
          cp "$DATA_DIR/Library/Application Support/qa-status.json" output/qa-status.json
          cat output/qa-status.json
          python3 -c 'import json; d=json.load(open("output/qa-status.json")); assert d["ready"], d'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Mushui-AI-Extra-IPA
          path: |
            output/Mushui-AI-Extra-unsigned.ipa
            output/SHA256SUMS.txt
            output/INSTALL_WINDOWS_IOS.md
            output/iPhone-Simulator.png
            output/qa-status.json
          retention-days: 7
